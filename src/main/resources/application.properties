spring.application.name=smart_city
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/smartcity}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Sample CVs default to a private location outside the application.
app.cv.directory=${CV_STORAGE_DIR:${user.home}/.smartcity/cvs}

app.analytics.collection-enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
